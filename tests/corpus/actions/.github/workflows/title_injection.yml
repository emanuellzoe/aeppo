name: Triage
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - run: echo "New issue: ${{ github.event.issue.title }}"
      - name: Inspect body
        run: |
          echo "Checking issue"
          echo "${{ github.event.issue.body }}" | grep -q bug
