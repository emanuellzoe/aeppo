name: Safe patterns
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./local-action
      # ${{ github.event.issue.title }} in a comment is not expanded
      - name: Use untrusted text through the environment
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR #${{ github.event.pull_request.number }}: $TITLE"
          echo "token length ${{ secrets.TOKEN != '' }}"
