name: aeppo

description: Statically scan a repository with aeppo.

author: emanuellzoe

inputs:
  path:
    description: Repository file or directory to scan, relative to the workspace or absolute.
    required: false
    default: .
  format:
    description: Finding output format (text, json, or sarif).
    required: false
    default: text
  min-severity:
    description: Report only findings at or above this severity (low, medium, or high).
    required: false
    default: low
  baseline:
    description: Path to a JSON baseline written by `aeppo scan --format json`; findings recorded there are ignored.
    required: false
    default: ""
  output-file:
    description: Write the report to this file instead of the log (for example a SARIF file to upload).
    required: false
    default: ""
  exclude:
    description: Newline-separated relative path globs to exclude.
    required: false
    default: ""
  max-file-size:
    description: Skip files larger than this many bytes.
    required: false
    default: "1048576"
  osv:
    description: Set to "true" to look up lockfile dependency versions in OSV.dev for known vulnerabilities and malware (VULN001, MAL001). Sends package names and versions to api.osv.dev.
    required: false
    default: "false"
  python-version:
    description: Python version used to run aeppo.
    required: false
    default: "3.12"
  fail-on-findings:
    description: Fail the workflow when aeppo reports findings.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Run aeppo scan
      shell: bash
      env:
        AEPPO_ACTION_PATH: ${{ github.action_path }}
        AEPPO_SCAN_PATH: ${{ inputs.path }}
        AEPPO_FORMAT: ${{ inputs.format }}
        AEPPO_EXCLUDES: ${{ inputs.exclude }}
        AEPPO_MAX_FILE_SIZE: ${{ inputs.max-file-size }}
        AEPPO_FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        AEPPO_MIN_SEVERITY: ${{ inputs.min-severity }}
        AEPPO_BASELINE: ${{ inputs.baseline }}
        AEPPO_OUTPUT_FILE: ${{ inputs.output-file }}
        AEPPO_OSV: ${{ inputs.osv }}
      run: python "$AEPPO_ACTION_PATH/scripts/action_entry.py"
